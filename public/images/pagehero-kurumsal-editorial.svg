<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img">
  <title>Tamamlanmış taş cepheli yapı ve giriş avlusu — kalıcılık ve ustalık</title>
  <defs>
    <linearGradient id="sky" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/><stop offset="0.45" stop-color="#f3eee5"/><stop offset="1" stop-color="#e2dbcd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7e0c9" stop-opacity="0.8"/><stop offset="1" stop-color="#f7e0c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0.85" y2="0.6">
      <stop offset="0" stop-color="#f2ead9"/><stop offset="0.45" stop-color="#e2d5bd"/><stop offset="1" stop-color="#c6b498"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#c9b79b"/><stop offset="1" stop-color="#a8957a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6f8f9f"/><stop offset="0.5" stop-color="#48697a"/><stop offset="1" stop-color="#2f4c5b"/>
    </linearGradient>
    <linearGradient id="paving" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ded6c7"/><stop offset="1" stop-color="#bdb3a0"/>
    </linearGradient>
    <filter id="b20" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
    <linearGradient id="hazeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e8" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#f7f2e8" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#f7f2e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0.5" y1="0.4" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8d8272" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#8d8272" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8d8272" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="vigX" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#8d8272" stop-opacity="0"/>
      <stop offset="1" stop-color="#8d8272" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="300" r="320" fill="url(#glow)"/>

  <!-- komşu kütle (gölgede) -->
  <g opacity="0.6">
    <rect x="360" y="470" width="180" height="450" fill="url(#stoneDark)"/>
    <g fill="#8e7c62" opacity="0.35">
      <rect x="388" y="520" width="44" height="60"/><rect x="452" y="520" width="44" height="60"/>
      <rect x="388" y="620" width="44" height="60"/><rect x="452" y="620" width="44" height="60"/>
      <rect x="388" y="720" width="44" height="60"/><rect x="452" y="720" width="44" height="60"/>
    </g>
  </g>

  <!-- ANA YAPI: taş cephe -->
  <g>
    <rect x="600" y="236" width="620" height="684" fill="url(#stone)"/>
    <!-- üst parapet -->
    <rect x="586" y="222" width="648" height="20" fill="#f7f0e1"/>
    <rect x="586" y="222" width="648" height="4" fill="#fffdf7" opacity="0.8"/>

    <!-- kat döşemeleri -->
    <g stroke="#bda98d" stroke-width="2" opacity="0.55">
      <path d="M600 400 H1220"/><path d="M600 564 H1220"/><path d="M600 728 H1220"/>
    </g>

    <!-- pencere dizileri -->
    <g fill="url(#glass)">
      <rect x="642" y="300" width="112" height="84" opacity="0.92"/><rect x="782" y="300" width="112" height="84" opacity="0.92"/>
      <rect x="922" y="300" width="112" height="84" opacity="0.92"/><rect x="1062" y="300" width="112" height="84" opacity="0.92"/>
      <rect x="642" y="452" width="112" height="96" opacity="0.9"/><rect x="782" y="452" width="112" height="96" opacity="0.9"/>
      <rect x="922" y="452" width="112" height="96" opacity="0.9"/><rect x="1062" y="452" width="112" height="96" opacity="0.9"/>
      <rect x="642" y="616" width="112" height="96" opacity="0.85"/><rect x="782" y="616" width="112" height="96" opacity="0.85"/>
      <rect x="922" y="616" width="112" height="96" opacity="0.85"/><rect x="1062" y="616" width="112" height="96" opacity="0.85"/>
    </g>
    <!-- pencere üstü ışık -->
    <g fill="#dbeaf0" opacity="0.45">
      <rect x="642" y="300" width="112" height="6"/><rect x="782" y="300" width="112" height="6"/>
      <rect x="922" y="300" width="112" height="6"/><rect x="1062" y="300" width="112" height="6"/>
      <rect x="642" y="452" width="112" height="6"/><rect x="782" y="452" width="112" height="6"/>
      <rect x="922" y="452" width="112" height="6"/><rect x="1062" y="452" width="112" height="6"/>
    </g>

    <!-- giriş: derin boşluk + sıcak ışık -->
    <rect x="826" y="760" width="196" height="160" fill="#2c4551"/>
    <rect x="838" y="774" width="172" height="146" fill="#3c5b69"/>
    <rect x="826" y="760" width="196" height="6" fill="#12242e"/>
    <rect x="760" y="744" width="330" height="18" fill="#f7f0e1"/>
    <rect x="760" y="744" width="330" height="4" fill="#fffdf7" opacity="0.8"/>
    <!-- kanopi gölgesi -->
    <path d="M760 762 H1090 V790 H760 Z" fill="#a3906f" opacity="0.25"/>
  </g>

  <!-- avlu: taş döşeme -->
  <rect x="0" y="920" width="1600" height="80" fill="url(#paving)"/>
  <path d="M0 920 H1600" stroke="#b7ab96" stroke-width="2" opacity="0.7"/>
  <g stroke="#b7ab96" stroke-width="1.4" opacity="0.4">
    <path d="M0 950 H1600"/><path d="M0 980 H1600"/>
  </g>

  <!-- avlu ağacı: ince, mimari -->
  <g opacity="0.85">
    <ellipse cx="1330" cy="926" rx="86" ry="10" fill="#a2977f" opacity="0.3" filter="url(#b20)"/>
    <path d="M1330 920 V790" stroke="#7f6f57" stroke-width="7"/>
    <g stroke="#7f6f57" stroke-width="4" opacity="0.8">
      <path d="M1330 850 L1292 812"/><path d="M1330 838 L1368 802"/><path d="M1330 812 L1300 780"/>
    </g>
    <g fill="#9aa88f" opacity="0.5">
      <circle cx="1296" cy="796" r="34"/><circle cx="1356" cy="786" r="30"/><circle cx="1326" cy="762" r="36"/>
    </g>
  </g>

  <!-- terracotta vurgu: kapı yanı pano -->
  <rect x="1042" y="806" width="8" height="114" fill="#a34e3a"/>

  <g opacity="0.22">
    <polygon points="1420,150 1454,170 1454,210 1420,230 1386,210 1386,170" fill="none" stroke="#1f435c" stroke-width="2"/>
    <polygon points="1420,174 1442,187 1442,207 1420,220 1398,207 1398,187" fill="none" stroke="#a34e3a" stroke-width="2"/>
  </g>
  <!-- atmosferik derinlik: uzak düzlemde hafif sis -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#hazeV)" opacity="0.55"/>
  <!-- ön plan gölgesi: zemine yakın koyulaşma -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#vignette)"/>
  <!-- gren -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05"/>
</svg>
