<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="t" fill="none">
<title id="t">Üç kademeli kütle, cam cephe, teraslar ve terracotta saçakla temsili bitmiş yapı</title>
<defs>
 <linearGradient id="stone" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#eeeae2"/><stop offset="1" stop-color="#cfc8bb"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7d1c5"/><stop offset="1" stop-color="#b8b3a8"/></linearGradient>
 <linearGradient id="glazing" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#d6e3e2"/><stop offset=".58" stop-color="#a7c0c3"/><stop offset="1" stop-color="#7898a4"/></linearGradient>
 <linearGradient id="terra" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd755c"/><stop offset="1" stop-color="#a34e3a"/></linearGradient>
 <filter id="cast" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<!-- A slight ground datum, not a decorative frame. -->
<path d="M96 719h1015" stroke="#84938e" stroke-width="2.2"/>
<ellipse cx="608" cy="741" rx="449" ry="22" fill="#6b7776" opacity=".13" filter="url(#cast)"/>
<!-- Left wing: modest scale and recessed paired windows. -->
<g stroke="#1f435c" stroke-linejoin="round">
 <path d="M174 362h303v356H174z" fill="url(#stone)" stroke-width="3.5"/>
 <path d="m477 362 18-10v366l-18 0z" fill="#b8b2a7" stroke-width="2"/>
 <path d="m174 362 18-11h303l-18 11z" fill="#f5f2eb" stroke-width="1.8"/>
 <path d="M162 352h331v18H162z" fill="#e8e4db" stroke-width="3"/>
</g>
<g stroke="#ada698" stroke-width="1.25" opacity=".6"><path d="M179 470h291m-291 132h291M326 372v345"/></g>
<g fill="#567789" stroke="#1f435c" stroke-width="2.7"><path d="M207 407h103v74H207zM337 407h103v74H337zM207 523h103v73H207zM337 523h103v73H337z"/></g>
<g fill="url(#glazing)" stroke="#648893" stroke-width="1.6"><path d="M213 414h91v61h-91zM343 414h91v61h-91zM213 530h91v60h-91zM343 530h91v60h-91z"/></g>
<g stroke="#cae0e0" stroke-width="1.7" opacity=".8"><path d="M258 414v61m130-61v61M258 530v60m130-60v60"/></g>
<!-- A real left terrace parapet and thin guardrail behind it. -->
<path d="M176 355v-41h300v41" stroke="#31566b" stroke-width="3"/>
<g stroke="#65818a" stroke-width="2.2"><path d="M189 354v-37m42 37v-37m42 37v-37m42 37v-37m42 37v-37m42 37v-37m42 37v-37M178 317h297"/></g>
<!-- Tall central mass: continuous mullions, setbacks and readable structure. -->
<g stroke="#1f435c" stroke-linejoin="round">
 <path d="M435 156h365v562H435z" fill="url(#face)" stroke-width="4"/>
 <path d="m800 156 23-14v576h-23z" fill="#8da5a8" stroke-width="2.5"/>
 <path d="m435 156 23-14h365l-23 14z" fill="#f4f1e9" stroke-width="2"/>
 <path d="M425 147h389v18H425z" fill="#e9e5dd" stroke-width="3"/>
</g>
<!-- Glass is inset within the structural perimeter, not applied as a flat sticker. -->
<path d="M454 184h328v411H454z" fill="#3c5e6f" stroke="#28495d" stroke-width="2.7"/>
<path d="M462 191h312v397H462z" fill="url(#glazing)"/>
<path d="M468 192h26v395h-26zM630 192h18v395h-18z" fill="#edf3ee" opacity=".23"/>
<g stroke="#315769" stroke-width="3.6"><path d="M526 188v402m76-402v402m76-402v402m76-402v402M456 292h325m-325 101h325m-325 101h325"/></g>
<g stroke="#f5faf5" stroke-width="1.7" opacity=".6"><path d="M463 194h311m-311 101h311m-311 101h311m-311 101h311"/></g>
<!-- The entrance is underneath, not painted over, the cantilever. -->
<path d="M518 615h206v103H518z" fill="#284657" stroke="#1c3d51" stroke-width="3"/>
<path d="M528 625h90v83h-90zm100 0h86v83h-86z" fill="url(#glazing)" stroke="#aacace" stroke-width="1.8"/>
<path d="M622 620v98" stroke="#d6e8e7" stroke-width="2.5"/>
<circle cx="607" cy="673" r="2.3" fill="#e7f0eb"/><circle cx="638" cy="673" r="2.3" fill="#e7f0eb"/>
<!-- Right wing steps back; its glass and balustrade follow the same floor levels. -->
<g stroke="#1f435c" stroke-linejoin="round">
 <path d="M778 274h262v444H778z" fill="url(#stone)" stroke-width="3.7"/>
 <path d="m1040 274 18-12v456h-18z" fill="#b9b1a5" stroke-width="2"/>
 <path d="m778 274 18-12h262l-18 12z" fill="#f5f2ea" stroke-width="2"/>
 <path d="M767 264h284v18H767z" fill="#e6e2d9" stroke-width="3"/>
</g>
<g fill="url(#glazing)" stroke="#446b7a" stroke-width="2.5"><path d="M798 316h220v111H798zM798 458h220v111H798zM798 600h220v94H798z"/></g>
<g stroke="#2f586a" stroke-width="2.5"><path d="M852 316v378m55-378v378m55-378v378M798 433h220m-220 142h220"/></g>
<g stroke="#edf4ef" stroke-width="1.6" opacity=".7"><path d="M800 320h216m-216 142h216m-216 142h216"/></g>
<path d="M788 266v-33h252v33" stroke="#31576b" stroke-width="2.7"/>
<g stroke="#68818a" stroke-width="2.1"><path d="M804 264v-30m42 30v-30m42 30v-30m42 30v-30m42 30v-30m42 30v-30M789 234h250"/></g>
<!-- Signature terracotta cantilever: a slim load-bearing canopy with an underside. -->
<g stroke="#954939" stroke-linejoin="round"><path d="M527 592h240l13 12H511z" fill="url(#terra)" stroke-width="2.3"/><path d="M511 604h269v8H511z" fill="#984b3a" stroke-width="1.7"/></g>
<path d="M527 594h240" stroke="#e9b09b" stroke-width="1.3" opacity=".75"/>
<path d="M541 612v10m207-10v10" stroke="#7f5145" stroke-width="1.7"/>
<!-- Landscape is restrained and scaled to the entrance, two separate trees. -->
<g stroke="#677c71" stroke-width="3.5" stroke-linecap="round"><path d="M125 719V622m0 50-22-27m22 9 21-29M1094 719V605m0 56-29-33m29 18 27-34"/></g>
<g fill="#9eae9b" fill-opacity=".42" stroke="#667c70" stroke-width="1.5"><path d="M88 634c-9-17 3-38 19-45 7-21 33-25 50-12 22-1 35 18 32 36 7 24-14 38-36 39h-43c-10 0-19-6-22-18Z"/><path d="M1049 619c-7-24 11-42 27-44 11-25 42-26 56-6 22 4 33 24 24 44-4 20-22 32-47 34h-34c-13 0-22-9-26-28Z"/></g>
<g stroke="#6f8979" stroke-width="1.2" opacity=".55"><path d="m111 610 16 16m19-35-18 31m-1-10 26-9m-44 25 15 11m958-25 15 20m22-37-18 32m-5-8 24-8"/></g>
<path d="M111 737h86m845 0h105M90 754h1030" stroke="#9da69b" stroke-width="1.7"/>
</svg>
