 <path d="m310 121 263-9 3 206-257 15z"/>
 <path d="m312 353 262-12 9 153-263 7z"/>
 <path d="m751 133 315 19-11 132-298-13z"/>
 <path d="m301 670 292-9 7 128-286 18z"/>
 <path d="m728 664 335-18-8 140-330 10z"/>
</g>
<!-- Building footprints are small double-line masses inside their own lots. -->
<g fill="#faf9f4" stroke="#3d6272" stroke-linejoin="round">
 <path d="m354 161 163-6 5 115-168 7z" stroke-width="2.7"/><path d="m369 175 134-6 4 88-138 5z" stroke-width="1.25"/>
 <path d="m364 388 160-5 3 77-158 4z" stroke-width="2.6"/><path d="m377 400 134-4 2 52-133 3z" stroke-width="1.25"/>
 <path d="m799 172 199 14-7 61-197-10z" stroke-width="2.6"/><path d="m811 185 173 12-5 38-171-10z" stroke-width="1.25"/>
