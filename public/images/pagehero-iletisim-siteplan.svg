<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="t" fill="none">
<title id="t">Yol bağlantısı, çevre parseller ve işaretli hedef parsel içeren temsili vaziyet planı</title>
<defs>
 <linearGradient id="street" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3e8e4"/><stop offset="1" stop-color="#cdd6d2"/></linearGradient>
 <linearGradient id="parcel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f1e9"/><stop offset="1" stop-color="#e4eae1"/></linearGradient>
 <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9c7b5"/><stop offset="1" stop-color="#d7a58c"/></linearGradient>
 <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
 <style>
  @media (prefers-reduced-motion: no-preference) { .location-ring { transform-box: view-box; transform-origin: 917px 386px; animation: location-pulse 3.8s ease-out infinite; } }
  @keyframes location-pulse { 0% { transform: scale(.94); opacity: .31; } 80%,100% { transform: scale(1.5); opacity: 0; } }
 </style>
</defs>
<!-- Streets are spatially connected; linework stops at the carriageway edges. -->
<path d="M74 522c241 8 388 13 536 7 175-6 359-27 508-19v119c-162-12-336 9-504 17-170 8-340-3-540-7V522Z" fill="url(#street)" stroke="#82969a" stroke-width="2.8"/>
