 <path d="m776 691 235-11-5 88-232 10z" stroke-width="2.6"/><path d="m791 706 205-10-4 58-202 9z" stroke-width="1.25"/>
</g>
<g stroke="#72919a" stroke-width="1.5" opacity=".8"><path d="M437 158v114m17 113v78m444-280-6 57M446 696l5 77m444-85-3 80"/></g>
