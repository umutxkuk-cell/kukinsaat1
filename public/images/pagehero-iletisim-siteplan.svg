<path d="M74 581c253 10 392 11 539 4 177-8 352-25 505-17" stroke="#fcfbf5" stroke-width="2.8" stroke-dasharray="22 24"/>
<!-- North-south connection enters the carriageway with a real intersection. -->
<path d="M602 62c-8 195 3 320 15 466l110 3c-15-154-25-304-18-469H602Z" fill="url(#street)" stroke="#82969a" stroke-width="2.6"/>
<path d="M615 62c-7 169 3 324 15 466m66-466c-7 169 6 327 18 467" stroke="#fcfbf5" stroke-width="2.2" opacity=".85"/>
<path d="M657 64c-6 171 4 323 14 464" stroke="#fcfbf5" stroke-width="2.4" stroke-dasharray="17 21"/>
<path d="M602 514q22 26 51 23m73-21q-23 25-55 25" stroke="#83979a" stroke-width="1.7"/>
