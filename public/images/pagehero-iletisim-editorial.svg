<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img">
  <title>Aydınlık yapı girişi ve davet eden sıcak ışık — açık iletişim</title>
  <defs>
    <linearGradient id="sky" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fcf9f4"/><stop offset="0.45" stop-color="#f5f0e7"/><stop offset="1" stop-color="#e6dfd1"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8dfc0" stop-opacity="0.95"/><stop offset="0.55" stop-color="#f7e4cd" stop-opacity="0.4"/><stop offset="1" stop-color="#f7e4cd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0.85" y2="0.6">
      <stop offset="0" stop-color="#e2ddd2"/><stop offset="0.55" stop-color="#cdc6b8"/><stop offset="1" stop-color="#aaa294"/>
    </linearGradient>
    <linearGradient id="concreteD" x1="0" y1="0" x2="0.9" y2="0.5">
      <stop offset="0" stop-color="#c2bbac"/><stop offset="1" stop-color="#948d7f"/>
    </linearGradient>
    <linearGradient id="opening" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#f6dcbb"/><stop offset="0.45" stop-color="#f7e8d3"/><stop offset="1" stop-color="#fdf7ed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7c9cab"/><stop offset="1" stop-color="#3b5967"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ded6c7"/><stop offset="1" stop-color="#b9af9c"/>
    </linearGradient>
    <linearGradient id="spill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#f8e2c4" stop-opacity="0.85"/><stop offset="1" stop-color="#f8e2c4" stop-opacity="0"/>
    </linearGradient>
    <filter id="b22" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="b10" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
    <linearGradient id="hazeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e8" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#f7f2e8" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#f7f2e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0.5" y1="0.4" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8d8272" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#8d8272" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8d8272" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="vigX" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#8d8272" stop-opacity="0"/>
      <stop offset="1" stop-color="#8d8272" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- sıcak ışık kaynağı: giriş -->
  <circle cx="1090" cy="620" r="300" fill="url(#warmGlow)"/>

  <!-- BETON YAPI: giriş çerçevesi -->
  <g>
    <rect x="620" y="180" width="820" height="760" fill="url(#concrete)"/>
    <rect x="606" y="164" width="848" height="22" fill="#f8f2e5"/>
    <rect x="606" y="164" width="848" height="4" fill="#fffdf7" opacity="0.85"/>

    <!-- sağ kanat: cam cephe -->
    <g>
      <rect x="1230" y="260" width="210" height="680" fill="url(#glass)" opacity="0.9"/>
      <g stroke="#dfeaef" stroke-width="3" opacity="0.35">
        <path d="M1300 264 V940"/><path d="M1372 264 V940"/>
      </g>
      <g stroke="#cfdde4" stroke-width="2" opacity="0.3">
        <path d="M1230 420 H1440"/><path d="M1230 600 H1440"/><path d="M1230 780 H1440"/>
      </g>
    </g>

    <!-- GİRİŞ BOŞLUĞU: davetkâr, aydınlık -->
    <g>
      <rect x="880" y="470" width="300" height="470" fill="url(#opening)"/>
      <!-- iç mekân derinliği -->
      <rect x="912" y="510" width="236" height="430" fill="#f2e2c8" opacity="0.6"/>
      <rect x="912" y="510" width="236" height="8" fill="#fdf6e9" opacity="0.9"/>
      <!-- arkada ikinci açıklık: derinlik -->
      <rect x="990" y="600" width="110" height="340" fill="#e9d3b2" opacity="0.7"/>
      <!-- zemin ışığı -->
      <path d="M880 940 H1180 L1150 812 H910 Z" fill="url(#spill)" opacity="0.6"/>
    </g>

    <!-- kanopi / saçak -->
    <rect x="852" y="440" width="360" height="26" fill="#f4ecdd"/>
    <rect x="852" y="440" width="360" height="5" fill="#fffdf7" opacity="0.9"/>
    <rect x="852" y="466" width="360" height="10" fill="#b3a892" opacity="0.35"/>

    <!-- sol kanat: taş kaplama -->
    <g>
      <rect x="620" y="260" width="230" height="680" fill="url(#concreteD)" opacity="0.5"/>
      <g stroke="#a89a84" stroke-width="2" opacity="0.5">
        <path d="M620 380 H850"/><path d="M620 500 H850"/><path d="M620 620 H850"/><path d="M620 740 H850"/><path d="M620 860 H850"/>
        <path d="M735 260 V940"/>
      </g>
      <!-- küçük pencere -->
      <rect x="670" y="400" width="120" height="86" fill="url(#glass)" opacity="0.85"/>
      <rect x="670" y="400" width="120" height="4" fill="#d9e8ee" opacity="0.5"/>
    </g>

    <!-- terracotta: giriş kenarı -->
    <rect x="1180" y="470" width="9" height="470" fill="#a34e3a"/>
  </g>

  <!-- avlu -->
  <rect x="0" y="940" width="1600" height="60" fill="url(#floor)"/>
  <path d="M0 940 H1600" stroke="#b7ab96" stroke-width="2" opacity="0.6"/>

  <!-- ölçek için: saksı ve ağaç -->
  <g opacity="0.9">
    <ellipse cx="520" cy="946" rx="70" ry="9" fill="#a2977f" opacity="0.3" filter="url(#b10)"/>
    <rect x="490" y="880" width="62" height="62" fill="#bcb2a0"/>
    <rect x="490" y="880" width="62" height="5" fill="#f2ebdd" opacity="0.7"/>
    <path d="M521 880 V800" stroke="#7f6f57" stroke-width="6"/>
    <g fill="#93a088" opacity="0.5">
      <circle cx="504" cy="792" r="26"/><circle cx="540" cy="784" r="30"/><circle cx="522" cy="756" r="26"/>
    </g>
  </g>

  <!-- girişe yönelen yumuşak ışık oku -->
  <path d="M1140 700 L1310 700" stroke="#f0d6b4" stroke-width="3" opacity="0.35" filter="url(#b10)"/>

  <g opacity="0.22">
    <polygon points="1420,120 1454,140 1454,180 1420,200 1386,180 1386,140" fill="none" stroke="#1f435c" stroke-width="2"/>
    <polygon points="1420,144 1442,157 1442,177 1420,190 1398,177 1398,157" fill="none" stroke="#a34e3a" stroke-width="2"/>
  </g>
  <!-- atmosferik derinlik: uzak düzlemde hafif sis -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#hazeV)" opacity="0.55"/>
  <!-- ön plan gölgesi: zemine yakın koyulaşma -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#vignette)"/>
  <!-- gren -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05"/>
</svg>
