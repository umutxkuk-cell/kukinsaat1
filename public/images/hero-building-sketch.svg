<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img">
  <title>Kule vinç, betonarme iskelet ve iskele — inşaat sahası</title>
  <defs>
    <linearGradient id="sky" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="0.42" stop-color="#f4efe6"/>
      <stop offset="0.78" stop-color="#e9e2d6"/>
      <stop offset="1" stop-color="#ddd5c6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7dcc2" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#f6e6d3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6e6d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e1d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ded7c9" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cityFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe6e7"/>
      <stop offset="1" stop-color="#c9d5d7"/>
    </linearGradient>
    <linearGradient id="cityMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6d1d3"/>
      <stop offset="1" stop-color="#a9b9bd"/>
    </linearGradient>

    <linearGradient id="concTop" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e6e1d7"/>
      <stop offset="1" stop-color="#cfc8bb"/>
    </linearGradient>
    <linearGradient id="concFace" x1="0" y1="0" x2="0.85" y2="0.5">
      <stop offset="0" stop-color="#cec7ba"/>
      <stop offset="0.55" stop-color="#b8b1a4"/>
      <stop offset="1" stop-color="#9e9789"/>
    </linearGradient>
    <linearGradient id="concDark" x1="0" y1="0" x2="0.9" y2="0.6">
      <stop offset="0" stop-color="#9a937f"/>
      <stop offset="1" stop-color="#7b7566"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7d9dad"/>
      <stop offset="0.45" stop-color="#527383"/>
      <stop offset="1" stop-color="#32505f"/>
    </linearGradient>
    <linearGradient id="glassLight" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#cfe2e9"/>
      <stop offset="1" stop-color="#8fb2c1"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#2a4a5e"/>
      <stop offset="0.6" stop-color="#1e3a4b"/>
      <stop offset="1" stop-color="#142c3a"/>
    </linearGradient>
    <linearGradient id="terr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b96148"/>
      <stop offset="1" stop-color="#a34e3a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ded6c7"/>
      <stop offset="0.5" stop-color="#d2c9b8"/>
      <stop offset="1" stop-color="#bdb3a0"/>
    </linearGradient>

    <filter id="b24" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="b8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
    <linearGradient id="hazeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e8" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#f7f2e8" stop-opacity="0.18"/>
      <stop offset="0.72" stop-color="#f7f2e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0.5" y1="0.4" x2="0.5" y2="1">
      <stop offset="0" stop-color="#8d8272" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#8d8272" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8d8272" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="vigX" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#8d8272" stop-opacity="0"/>
      <stop offset="1" stop-color="#8d8272" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1150" cy="300" r="300" fill="url(#sun)"/>

  <!-- atmosferik uzak doku -->
  <g opacity="0.55" filter="url(#b24)">
    <ellipse cx="1120" cy="700" rx="520" ry="120" fill="#d5cbb9"/>
  </g>

  <!-- UZAK ŞEHİR: yapının arkasında, çok soluk -->
  <g opacity="0.5">
    <g fill="url(#cityFar)" filter="url(#b3)">
      <rect x="1180" y="640" width="78" height="276"/>
      <rect x="1272" y="600" width="58" height="316"/>
      <rect x="1350" y="656" width="92" height="260"/>
      <rect x="900" y="676" width="54" height="240"/>
    </g>
    <g fill="url(#cityMid)" opacity="0.6" filter="url(#b3)">
      <rect x="1206" y="700" width="110" height="216"/>
    </g>
  </g>

  <!-- İNŞAATI SÜREN YAPI -->
  <g>
    <!-- gölge -->
    <ellipse cx="1180" cy="906" rx="300" ry="22" fill="#a4998a" opacity="0.32" filter="url(#b8)"/>

    <!-- çekirdek: arka duvar -->
    <rect x="958" y="382" width="512" height="520" fill="url(#concFace)" opacity="0.55"/>

    <!-- döşemeler ve kolonlar -->
    <g fill="url(#concTop)">
      <rect x="950" y="330" width="530" height="20"/>
      <rect x="950" y="452" width="530" height="20"/>
      <rect x="950" y="574" width="530" height="20"/>
      <rect x="950" y="696" width="530" height="20"/>
      <rect x="950" y="818" width="530" height="20"/>
    </g>
    <g fill="url(#concFace)">
      <rect x="952" y="350" width="20" height="556"/>
      <rect x="1096" y="350" width="20" height="556"/>
      <rect x="1240" y="350" width="20" height="556"/>
      <rect x="1384" y="350" width="20" height="556"/>
      <rect x="1458" y="350" width="20" height="556"/>
    </g>
    <!-- kolon ışık kenarları -->
    <g fill="#fffdf7" opacity="0.45">
      <rect x="952" y="350" width="4" height="556"/>
      <rect x="1096" y="350" width="4" height="556"/>
      <rect x="1240" y="350" width="4" height="556"/>
      <rect x="1384" y="350" width="4" height="556"/>
    </g>

    <!-- alt iki kat: tamamlanmış cam cephe -->
    <g>
      <rect x="972" y="716" width="486" height="100" fill="url(#glass)" opacity="0.94"/>
      <rect x="972" y="838" width="486" height="94" fill="url(#glass)" opacity="0.82"/>
      <g stroke="#e8e2d6" stroke-width="3.5" opacity="0.5">
        <path d="M1116 720 V934"/><path d="M1260 720 V934"/><path d="M1404 720 V934"/>
      </g>
      <rect x="972" y="716" width="486" height="4" fill="url(#glassLight)" opacity="0.7"/>
      <rect x="972" y="840" width="486" height="3" fill="url(#glassLight)" opacity="0.55"/>
    </g>

    <!-- orta kat: kalıp ve inşaat halindeki yüzey -->
    <g>
      <rect x="972" y="472" width="486" height="100" fill="url(#concDark)" opacity="0.5"/>
      <g stroke="#8c8577" stroke-width="2" opacity="0.4">
        <path d="M1040 472 V572"/><path d="M1180 472 V572"/><path d="M1320 472 V572"/>
      </g>
      <!-- kalıp panelleri -->
      <rect x="972" y="476" width="486" height="92" fill="#a9a293" opacity="0.45"/>
      <g stroke="#8c8577" stroke-width="2" opacity="0.35">
        <path d="M1054 476 V568"/><path d="M1136 476 V568"/><path d="M1218 476 V568"/>
        <path d="M1300 476 V568"/><path d="M1382 476 V568"/>
      </g>
      <rect x="972" y="476" width="486" height="4" fill="#fff" opacity="0.4"/>
      <!-- üstte kalıp paneli -->
      <rect x="1150" y="356" width="164" height="72" fill="#c6beb0" opacity="0.9"/>
      <rect x="1150" y="356" width="164" height="4" fill="#fffdf7" opacity="0.6"/>
      <g stroke="#a9a08f" stroke-width="2" opacity="0.7">
        <path d="M1190 360 V424"/><path d="M1232 360 V424"/><path d="M1274 360 V424"/>
      </g>
    </g>

    <!-- üst kat: donatı filizi -->
    <g stroke="#8f8878" stroke-width="2.6" opacity="0.7">
      <path d="M986 330 V286"/><path d="M1012 330 V272"/><path d="M1038 330 V292"/>
      <path d="M1128 330 V278"/><path d="M1154 330 V294"/><path d="M1180 330 V266"/>
      <path d="M1272 330 V288"/><path d="M1298 330 V276"/><path d="M1324 330 V296"/>
      <path d="M1418 330 V282"/><path d="M1444 330 V292"/>
    </g>

    <!-- iskele: bina solunda, çapraz bağlantılı -->
    <g opacity="0.9">
      <g stroke="#a99f8b" stroke-width="3">
        <path d="M908 386 V916"/><path d="M936 386 V916"/>
        <path d="M908 386 H936"/>
        <path d="M908 460 H936"/><path d="M908 534 H936"/><path d="M908 608 H936"/>
        <path d="M908 682 H936"/><path d="M908 756 H936"/><path d="M908 830 H936"/>
      </g>
      <g stroke="#c0b6a3" stroke-width="2" opacity="0.65">
        <path d="M908 460 L936 534"/><path d="M936 460 L908 534"/>
        <path d="M908 608 L936 682"/><path d="M936 608 L908 682"/>
        <path d="M908 756 L936 830"/><path d="M936 756 L908 830"/>
      </g>
      <!-- çalışma platformları -->
      <g fill="#b8ae9b" opacity="0.9">
        <rect x="902" y="534" width="40" height="6"/>
        <rect x="902" y="682" width="40" height="6"/>
        <rect x="902" y="830" width="40" height="6"/>
      </g>
    </g>
  </g>

  <!-- KULE VİNÇ -->
  <g>
    <!-- gövde: kafes -->
    <path d="M780 236 L816 236 L816 916 L780 916 Z" fill="url(#steel)"/>
    <g stroke="#8fb0c2" stroke-width="2" opacity="0.35">
      <path d="M780 300 L816 340"/><path d="M816 300 L780 340"/>
      <path d="M780 380 L816 420"/><path d="M816 380 L780 420"/>
      <path d="M780 460 L816 500"/><path d="M816 460 L780 500"/>
      <path d="M780 540 L816 580"/><path d="M816 540 L780 580"/>
      <path d="M780 620 L816 660"/><path d="M816 620 L780 660"/>
      <path d="M780 700 L816 740"/><path d="M816 700 L780 740"/>
      <path d="M780 780 L816 820"/><path d="M816 780 L780 820"/>
      <path d="M780 860 L816 900"/><path d="M816 860 L780 900"/>
    </g>
    <!-- terracotta bant -->
    <rect x="778" y="236" width="40" height="16" fill="url(#terr)"/>

    <!-- kule başı -->
    <path d="M766 236 L830 236 L830 196 L798 170 L766 196 Z" fill="#1b3547"/>
    <path d="M798 170 V96" stroke="#1b3547" stroke-width="5"/>

    <!-- ana kol -->
    <path d="M798 198 L60 246 L60 258 L798 228 Z" fill="#22455a"/>
    <path d="M798 198 L60 246" stroke="#93b3c4" stroke-width="2.6" opacity="0.5"/>
    <path d="M798 228 L60 258" stroke="#0f2634" stroke-width="1.6" opacity="0.5"/>

    <!-- karşı ağırlık -->
    <path d="M798 206 L1016 220 L1016 232 L798 222 Z" fill="#22455a"/>
    <rect x="976" y="222" width="46" height="40" fill="#2c4c60"/>
    <rect x="976" y="222" width="46" height="4" fill="#8fb0c2" opacity="0.4"/>

    <!-- halatlar -->
    <g stroke="#22455a" stroke-width="2" opacity="0.65">
      <path d="M798 96 L798 170"/>
      <path d="M798 116 L370 244"/>
      <path d="M798 116 L120 250"/>
      <path d="M798 116 L1006 224"/>
    </g>

    <!-- kanca + taşınan kiriş -->
    <path d="M470 250 V556" stroke="#22455a" stroke-width="2.6"/>
    <path d="M456 556 H484 L470 578 Z" fill="#22455a"/>
    <g transform="rotate(-1.6 470 618)">
      <rect x="356" y="590" width="228" height="34" fill="url(#concFace)"/>
      <rect x="356" y="590" width="228" height="5" fill="#fffdf7" opacity="0.5"/>
      <rect x="356" y="618" width="228" height="6" fill="url(#concDark)" opacity="0.6"/>
      <g stroke="#8c8577" stroke-width="1.4" opacity="0.5">
        <path d="M404 595 V620"/><path d="M456 595 V620"/><path d="M508 595 V620"/><path d="M556 595 V620"/>
      </g>
      <path d="M470 578 L470 590" stroke="#22455a" stroke-width="2.4"/>
    </g>

    <!-- kabin -->
    <rect x="832" y="316" width="76" height="58" fill="#1b3547"/>
    <rect x="840" y="324" width="34" height="24" fill="#a9cad9" opacity="0.8"/>
    <rect x="832" y="316" width="76" height="4" fill="#93b3c4" opacity="0.35"/>
  </g>

  <!-- ZEMİN -->
  <rect x="0" y="916" width="1600" height="84" fill="url(#ground)"/>
  <path d="M0 916 H1600" stroke="#b3a894" stroke-width="2" opacity="0.7"/>

  <!-- saha: malzeme, donatı demeti, kalıp -->
  <g>
    <ellipse cx="330" cy="962" rx="230" ry="14" fill="#a2977f" opacity="0.28" filter="url(#b8)"/>

    <!-- beton blok istifi -->
    <g>
      <rect x="196" y="936" width="180" height="18" fill="#bdb3a0"/>
      <rect x="204" y="916" width="180" height="18" fill="#c8beab"/>
      <rect x="190" y="954" width="196" height="18" fill="#aea592"/>
      <rect x="204" y="916" width="180" height="3" fill="#fffdf7" opacity="0.5"/>
    </g>

    <!-- donatı demeti -->
    <g stroke="#8e8672" stroke-width="3.2">
      <path d="M470 938 H610"/><path d="M470 948 H610"/><path d="M470 958 H610"/>
      <circle cx="478" cy="943" r="7" fill="none"/><circle cx="596" cy="953" r="7" fill="none"/>
    </g>

    <!-- kalıp paneli yaslı -->
    <g transform="rotate(-8 720 930)">
      <rect x="664" y="856" width="104" height="96" fill="#c7bdab"/>
      <rect x="664" y="856" width="104" height="4" fill="#fffdf7" opacity="0.55"/>
      <g stroke="#b3a996" stroke-width="2" opacity="0.7">
        <path d="M690 860 V948"/><path d="M716 860 V948"/><path d="M742 860 V948"/>
      </g>
    </g>

    <!-- saha çiti -->
    <g stroke="#b3a894" stroke-width="3" opacity="0.75">
      <path d="M90 916 V966"/><path d="M170 916 V966"/><path d="M250 916 V966"/>
      <path d="M90 930 H250"/><path d="M90 950 H250"/>
    </g>
  </g>

  <!-- ön plan gölge şeridi -->
  <rect x="0" y="916" width="1600" height="10" fill="#b3a894" opacity="0.2"/>

  <!-- marka imzası -->
  <g opacity="0.2">
    <polygon points="1490,120 1524,140 1524,180 1490,200 1456,180 1456,140" fill="none" stroke="#1f435c" stroke-width="2"/>
    <polygon points="1490,144 1512,157 1512,177 1490,190 1468,177 1468,157" fill="none" stroke="#a34e3a" stroke-width="2"/>
  </g>

  <!-- atmosferik derinlik: uzak düzlemde hafif sis -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#hazeV)" opacity="0.55"/>
  <!-- ön plan gölgesi: zemine yakın koyulaşma -->
  <rect x="0" y="0" width="1600" height="1000" fill="url(#vignette)"/>
  <!-- gren -->
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05"/>
</svg>
