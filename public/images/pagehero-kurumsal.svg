<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img">
  <title>Alacakaranlıkta tamamlanmış yapı ve sıcak ışıklı avlu</title>
  <defs>
    <linearGradient id="sky" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#16303f"/><stop offset="0.28" stop-color="#274a5c"/>
      <stop offset="0.54" stop-color="#5d6a72"/><stop offset="0.74" stop-color="#b08a7a"/>
      <stop offset="0.88" stop-color="#dd9f76"/><stop offset="1" stop-color="#f0c49a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0b8" stop-opacity="0.95"/><stop offset="0.45" stop-color="#f8c79a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f8c79a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="massA" x1="0" y1="0" x2="0.4" y2="0.7">
      <stop offset="0" stop-color="#1d2f39"/><stop offset="1" stop-color="#101a21"/>
    </linearGradient>
    <linearGradient id="massB" x1="0" y1="0" x2="0.5" y2="0.6">
      <stop offset="0" stop-color="#243a45"/><stop offset="1" stop-color="#131f27"/>
    </linearGradient>
    <linearGradient id="massC" x1="0" y1="0" x2="0.4" y2="0.6">
      <stop offset="0" stop-color="#2b4553"/><stop offset="1" stop-color="#172530"/>
    </linearGradient>
    <linearGradient id="litA" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd9a6"/><stop offset="1" stop-color="#e6a572"/>
    </linearGradient>
    <linearGradient id="litB" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f8c992"/><stop offset="1" stop-color="#d99a63"/>
    </linearGradient>
    <linearGradient id="terr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3714f"/><stop offset="1" stop-color="#a34e3a"/>
    </linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#18262e"/><stop offset="0.5" stop-color="#111c23"/><stop offset="1" stop-color="#0a1217"/>
    </linearGradient>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061016" stop-opacity="0.42"/><stop offset="0.3" stop-color="#061016" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#061016" stop-opacity="0"/><stop offset="1" stop-color="#061016" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="b40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="b14" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="430" cy="820" r="210" fill="url(#sunGlow)" filter="url(#b40)"/>
  <circle cx="430" cy="820" r="74" fill="#ffdfb2" opacity="0.2" filter="url(#b14)"/>
  <circle cx="430" cy="820" r="40" fill="#ffe9c8" opacity="0.62"/>
  <circle cx="430" cy="820" r="40" fill="#fff6e4" opacity="0.3" filter="url(#b6)"/>
  <g fill="#ffe3c6" opacity="0.14">
    <rect x="120" y="392" width="520" height="7" rx="3.5"/>
    <rect x="260" y="442" width="380" height="5" rx="2.5"/>
  </g>

  <!-- komşu yapı: alçak, sakin -->
  <g opacity="0.5">
    <rect x="300" y="628" width="170" height="256" fill="#16242d"/>
    <g fill="url(#litB)" opacity="0.34">
      <rect x="326" y="664" width="40" height="50"/><rect x="382" y="664" width="40" height="50"/>
      <rect x="326" y="738" width="40" height="50"/><rect x="382" y="738" width="40" height="50"/>
      <rect x="326" y="808" width="40" height="40"/>
    </g>
  </g>
  <g>
    <ellipse cx="1040" cy="890" rx="300" ry="18" fill="#0a1217" opacity="0.45" filter="url(#b14)"/>
    <rect x="760" y="300" width="560" height="584" fill="url(#massA)"/>
    <rect x="748" y="284" width="584" height="18" fill="#101a21"/>
    <rect x="748" y="284" width="584" height="2.5" fill="#ffcf9c" opacity="0.6"/>
    <g fill="url(#litA)" opacity="0.92">
      <rect x="796" y="336" width="82" height="60"/><rect x="906" y="336" width="82" height="60"/>
      <rect x="1016" y="336" width="82" height="60"/><rect x="1126" y="336" width="82" height="60"/>
      <rect x="1236" y="336" width="46" height="60"/>
      <rect x="796" y="426" width="82" height="60"/><rect x="906" y="426" width="82" height="60"/>
      <rect x="1016" y="426" width="82" height="60"/><rect x="1126" y="426" width="82" height="60"/>
      <rect x="1236" y="426" width="46" height="60"/>
      <rect x="796" y="516" width="82" height="60"/><rect x="1126" y="516" width="82" height="60"/>
      <rect x="1236" y="516" width="46" height="60"/>
      <rect x="796" y="606" width="82" height="60"/><rect x="1016" y="606" width="82" height="60"/>
    </g>
    <g fill="url(#litB)" opacity="0.66">
      <rect x="906" y="516" width="82" height="60"/><rect x="1016" y="516" width="82" height="60"/>
      <rect x="906" y="606" width="82" height="60"/><rect x="1126" y="606" width="82" height="60"/>
    </g>
    <g fill="#0f1a21" opacity="0.88">
      <rect x="1236" y="606" width="46" height="60"/><rect x="906" y="696" width="82" height="60"/>
      <rect x="1126" y="696" width="82" height="60"/>
    </g>
    <g stroke="#0b1419" stroke-width="5" opacity="0.9">
      <path d="M896 332 V770"/><path d="M1006 332 V770"/><path d="M1116 332 V770"/><path d="M1226 332 V770"/>
    </g>
    <rect x="956" y="792" width="160" height="92" fill="#0b1419"/>
    <rect x="972" y="806" width="128" height="78" fill="url(#litA)" opacity="0.86"/>
    <path d="M924 884 H1148 L1124 806 H948 Z" fill="#ffcf9c" opacity="0.16" filter="url(#b14)"/>
    <rect x="930" y="776" width="212" height="16" fill="#101a21"/>
    <rect x="930" y="776" width="212" height="3" fill="#ffcf9c" opacity="0.7"/>
    <rect x="1312" y="300" width="12" height="584" fill="url(#terr)" opacity="0.9"/>
  </g>
  <g>
    <path d="M648 884 V762" stroke="#16242d" stroke-width="10"/>
    <g fill="#1b2c35">
      <ellipse cx="606" cy="752" rx="44" ry="26"/><ellipse cx="676" cy="738" rx="40" ry="23"/>
      <ellipse cx="644" cy="712" rx="30" ry="18"/>
    </g>
    <ellipse cx="648" cy="888" rx="60" ry="8" fill="#0a1217" opacity="0.72"/>
  </g>
  <rect x="0" y="884" width="1600" height="116" fill="url(#groundG)"/>
  <rect x="0" y="882" width="1600" height="3" fill="#ffcf9c" opacity="0.2"/>  <rect width="1600" height="1000" fill="url(#vign)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.07"/>
</svg>