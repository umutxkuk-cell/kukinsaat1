    </g>
    <g stroke="#0b1419" stroke-width="4" opacity="0.85"><path d="M1291 240 V702"/></g>
    <rect x="1044" y="240" width="146" height="100" fill="url(#massB)" opacity="0.85"/>
    <rect x="1064" y="262" width="106" height="58" fill="url(#litB)" opacity="0.4"/>
    <rect x="866" y="560" width="300" height="324" fill="#0a1318"/>
    <rect x="892" y="586" width="248" height="298" fill="url(#litA)" opacity="0.95"/>
    <rect x="966" y="626" width="84" height="258" fill="#ffe3bd" opacity="0.42"/>
    <path d="M822 884 H1214 L1170 712 H868 Z" fill="#ffcf9c" opacity="0.22" filter="url(#b14)"/>
    <rect x="838" y="536" width="356" height="26" fill="#101a21"/>
    <rect x="838" y="536" width="356" height="3" fill="#ffcf9c" opacity="0.8"/>
    <rect x="1388" y="576" width="10" height="308" fill="url(#terr)" opacity="0.85"/>
  </g>
  <g>
