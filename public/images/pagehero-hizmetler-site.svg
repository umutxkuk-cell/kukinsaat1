<g class="load">
 <path d="m777 269 7 12 7-12" stroke="#a34e3a" stroke-width="2.5" stroke-linejoin="round"/>
 <path d="M784 281v9m0 0-82 25m82-25 82 25" stroke="#395d6b" stroke-width="2"/>
 <path d="M675 315h218v25H675z" fill="url(#cut)" stroke="#26485a" stroke-width="3.2"/>
 <path d="M679 318h210" stroke="#f9f8f3" stroke-width="1.8" opacity=".78"/>
</g>
<!-- A compact stack of controlled material, not stock-site clutter. -->
<g fill="#d0c8bb" stroke="#6c8588" stroke-width="1.6"><path d="M130 677h180v17H130zM144 656h159v17H144zM163 635h141v17H163z"/></g>
