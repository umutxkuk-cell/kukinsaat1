<path d="M250 130V66m0 20 355 99m-355-99 827 103M250 86 122 204" stroke="#345565" stroke-width="2.1"/>
<path d="M294 253h53v31h-53z" fill="#a6c0c3" stroke="#36596a" stroke-width="2"/>
<path d="M98 204h54v10H98zM229 166h45v11h-45z" fill="#a34e3a" opacity=".85"/>
<!-- The cable grows from the fixed trolley while the load follows it exactly. -->
